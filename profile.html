<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>cinemo - profile</title>
  </head>
  <body>
    <header class="profile_header">
      <img src="./imgs/cinemo-identity.svg" alt="" />
    </header>
    <main class="profile_main">
      <div class="profile_text">
        <div class="profile_text_1">YOUR OWN SCENE</div>
        <div class="profile_text_2">누구의 시간인가요?</div>
        <div class="profile_text_3">
          함께 보는 이야기, 취향은 각자의 방식으로.
        </div>
      </div>
      <div class="profile_sec">
        <div class="user_profile">
          <div class="user_profile_photo">
            <img src="./imgs/Avatar_Y.png" alt="프로필 사진" />
          </div>
          <div class="user_profile_info">
            <div class="user_profile_username">욜로</div>
            <div class="user_profile_about">나만의 영화 노트</div>
          </div>
        </div>
        <div class="user_profile">
          <div class="user_profile_photo">
            <img src="./imgs/Avatar_J.png" alt="프로필 사진" />
          </div>
          <div class="user_profile_info">
            <div class="user_profile_username">지호</div>
            <div class="user_profile_about">새로운 장면을 찾아서</div>
          </div>
        </div>
        <div class="user_profile">
          <div class="user_profile_photo">
            <img src="./imgs/Avatar_M.png" alt="프로필 사진" />
          </div>
          <div class="user_profile_info">
            <div class="user_profile_username">민</div>
            <div class="user_profile_about">오늘도 한 편</div>
          </div>
        </div>
        <div class="user_profile">
          <div class="user_profile_photo">
            <img src="./imgs/Avatar_G.png" alt="프로필 사진" />
          </div>
          <div class="user_profile_info">
            <div class="user_profile_username">게스트</div>
            <div class="user_profile_about">가볍게 돌려보기</div>
          </div>
        </div>
      </div>
      <a href="./index.html" class="profile_btn_a">
        <button class="profile_btn">
          <img src="./icon/pencil.svg" alt="" />
          프로필 선택
        </button>
      </a>
    </main>
    <footer class="profile_footer">당신의 다음 장면을 만나는 곳, CINEMO</footer>
  </body>
</html>
