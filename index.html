<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>cinemo</title>
  </head>
  <body>
    <header>
      <div class="index_header">헤더 영역입니다.</div>
    </header>
    <main>
      <div class="index_main_1">메인 1 영역입니다.</div>
      <section class="movie-section">
        <div class="section-header">
          <div class="section-heading">
            <p class="section-title">오늘, 새로운 세계로</p>
            <p class="section-count">4편의 이야기</p>
          </div>
          <p class="section-description">
            낯선 풍경 속에서 시작되는 네 편의 이야기
          </p>
        </div>

        <div class="movie-list">
          <div class="movie-card">
            <img src="./imgs/quiet-orbit.png" alt="고요의 궤도 이미지" />
            <p class="movie-title">고요의 궤도</p>
            <p class="movie-info">
              <span class="movie-info-dot">SF</span>
              <span>미스터리</span>
              <span>15+</span>
            </p>
          </div>
          <div class="movie-card">
            <img src="./imgs/last-platform.png" alt="마지막 승강장 이미지" />
            <p class="movie-title">마지막 승강장</p>
            <p class="movie-info">
              <span class="movie-info-dot">드라마</span>
              <span>12+</span>
            </p>
          </div>
          <div class="movie-card">
            <img src="./imgs/blue-hour.png" alt="파란 시간 이미지" />
            <p class="movie-title">파란 시간</p>
            <p class="movie-info">
              <span class="movie-info-dot">로맨스</span>
              <span class="movie-info-dot">드라마</span>
              <span>12+</span>
            </p>
          </div>
          <div class="movie-card">
            <img src="./imgs/forest-letter.png" alt="숲에서 온 편지 이미지" />
            <p class="movie-title">숲에서 온 편지</p>
            <p class="movie-info">
              <span class="movie-info-dot">판타지</span>
              <span class="movie-info-dot">드라마</span>
              <span>전체</span>
            </p>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="index_footer">푸터 영역입니다.</div>
    </footer>
  </body>
</html>
