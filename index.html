<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>cinemo</title>
  </head>
  <body>
    <main>
      <div class="index_main_1">
        <div class="hero_image">
          <img src="imgs/quiet-orbit.png" alt="hero_images" />
        </div>
        <div class="hero_text">
          <div class="hero_top">
            <span class="hero_top_1-1">이번 주의 발견</span>
            <span class="hero_top_1-2">VOL. 01</span>
          </div>
          <div class="hero_title">
            <p class="hero_title_1-1">고요의 궤도</p>
            <p class="hero_title_1-2">QUIET ORBIT</p>
          </div>
          <div class="hero_info">
            <span>2026 · SF · 미스터리</span>
            <span>15+</span>
            <span>1시간 48분</span>
          </div>
          <div class="hero_desc">
            모든 소리가 사라진 해안, 정체를 알 수 없는 신호가 도착한다. 마지막
            관측자는 그 고요 속으로 한 걸음 다가선다.
          </div>
          <div class="hero_action">
            <button class="hero_btn_more">↗ 작품 살펴보기</button>
            <button class="hero_btn_wish">+ 찜하기</button>
          </div>
        </div>
        <div class="hero_right_text">
          <p class="hero_right_text_1">
            고요가 시작되는 곳, 이야기가 깨어난다.
          </p>
          <p class="hero_right_text_2">A CINEMO ORIGINAL CONCEPT</p>
        </div>
        </div>
      </div>
    </main>
  </body>
</html>
